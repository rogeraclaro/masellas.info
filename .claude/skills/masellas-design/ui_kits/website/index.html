<!DOCTYPE html><html><head><meta charset="utf-8"><title>Roger Masellas, Frontend Developer</title>
<link rel="stylesheet" href="../../styles.css"><link rel="icon" href="../../assets/icons/favicon-32x32.png">
<style>html,body{margin:0;padding:0;overflow:hidden}a{color:inherit;text-decoration:none}a:hover{color:inherit}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel" src="CoverSection.jsx"></script>
<script type="text/babel" src="WordsSection.jsx"></script>
<script type="text/babel" src="QrScreen.jsx"></script>
<script type="text/babel" src="FullPage.jsx"></script>
<script type="text/babel">
function App(){
  const [qr,setQr]=React.useState(false);
  return <>
    <FullPage labels={['the point','some words']} sections={[<CoverSection/>,<WordsSection/>]}/>
    <button onClick={()=>setQr(true)} title="qr.html" style={{position:'fixed',right:10,bottom:10,zIndex:90,all:'unset',cursor:'pointer',fontFamily:'var(--font-body)',fontSize:16,background:'var(--menu-idle)',color:'#000',padding:'1px 8px'}}>qr</button>
    {qr && <QrScreen onClose={()=>setQr(false)}/>}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, tag or branch to deploy (empty = the selected branch). Use for rollbacks.'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_DIR: /home/rogermasellas/htdocs/masellas.info/
  APP_DIR: /home/rogermasellas/masellas-admin/app/

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Admin tests
        working-directory: admin
        run: npm test
      - name: Site tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The sources are the truth; always ship pages and bundles built from them (same script as locally).
      - name: Build pages and bundles
        run: sh scripts/build.sh

      # nginx caches css/js for 10 years, so version the URLs by content hash (fails if one is missing).
      - name: Cache-bust asset URLs
        run: sh scripts/cache-bust.sh

      - name: Configure SSH (pinned host key)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      # Order matters: the pages go out BEFORE the admin restarts, because on boot the admin
      # rewrites the projects pages with the live list for crawlers (admin/lib/seo-pages.js);
      # a site sync after it would put the empty lists back until the next save.

      # Fresh server only: the admin seeds its private data from these legacy files.
      - name: Seed legacy public data (fresh server only)
        run: |
          rsync -rltz --ignore-existing projects/data/projects.json projects/data/some-words.json \
            "deploy-target:${SITE_DIR}projects/data/"

      - name: Sync admin app (.env and data protected)
        run: |
          rsync -rltz --delete \
            --filter='P /.env' --filter='P /data/' \
            --exclude='/.env' --exclude='/data/' --exclude='/test/' --exclude='node_modules/' --exclude='.DS_Store' \
            admin/ "deploy-target:$APP_DIR"

      - name: Sync site (no perms, no delete)
        run: |
          # --checksum: CI checkouts have fresh mtimes, so compare content instead;
          # identical files (e.g. the root-owned christian/) are left alone.
          # No -t either: setting mtimes on files we don't own fails.
          # Pages: index.html, projects/, projects-ac/ (ca) plus en/ and es/; their sources (src/, i18n/) stay here.
          # projects/data/*.json (every language + the legacy files), llms.txt and sitemap-projects.xml
          # belong to the admin, and so do the project pages (<collection>/<id>/index.html): they are not
          # in the repo, and with no --delete this sync never touches them.
          rsync -rlz --checksum \
            --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='.claude/' \
            --exclude='/admin/' --exclude='/scripts/' --exclude='/src/' --exclude='/i18n/' \
            --exclude='.playwright-mcp/' --exclude='.DS_Store' --exclude='/package.json' \
            --exclude='/projects/data/*.json' --exclude='/llms.txt' --exclude='/sitemap-projects.xml' --exclude='*.md' \
            ./ "deploy-target:$SITE_DIR"

      - name: Restart admin (pm2)
        run: |
          ssh deploy-target 'bash -s' <<'EOF'
          set -euo pipefail
          mkdir -p ~/masellas-admin/data
          cd ~/masellas-admin/app
          if [ ! -f .env ]; then
            echo "::error::~/masellas-admin/app/.env is missing. Run the one-time setup in DEPLOY.md."
            exit 1
          fi
          # The data files exist from earlier runs, so the pages tell when this boot has published:
          # they must be newer than a stamp taken before the reload (1 s apart, for coarse mtimes).
          stamp=$(mktemp)
          sleep 1
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save
          site=~/htdocs/masellas.info
          # Wait for the restarted admin to publish the per-language files from live data
          # (projects-ac.ca.json: projects (B.C.), created empty by the admin on its first boot)
          # and to rewrite the six projects pages for crawlers (and the project pages; sitemap-projects.xml
          # is written last).
          published() {
            [ -f "$site/projects/data/projects.ca.json" ] && [ -f "$site/projects/data/projects-ac.ca.json" ] || return 1
            [ "$site/sitemap-projects.xml" -nt "$stamp" ] || return 1
            for page in projects projects-ac en/projects en/projects-ac es/projects es/projects-ac; do
              [ "$site/$page/index.html" -nt "$stamp" ] || return 1
            done
          }
          for i in $(seq 1 20); do
            published && { rm -f "$stamp"; exit 0; }
            sleep 0.5
          done
          rm -f "$stamp"
          echo "::error::admin did not publish projects.ca.json and projects-ac.ca.json, or did not rewrite the projects pages and sitemap-projects.xml, within 10s (see pm2 logs masellas-admin)"
          exit 1
          EOF

      # Anything the admin did not publish (should be nothing) gets the repo default.
      - name: Seed remaining public data files (fresh server only)
        run: |
          rsync -rltz --ignore-existing projects/data/*.json \
            "deploy-target:${SITE_DIR}projects/data/"

      - name: Smoke check
        run: |
          for path in /en/ /es/projects/ /projects-ac/ /en/projects-ac/ \
            /projects/data/projects.json /projects/data/some-words.json \
            /projects/data/projects.ca.json /projects/data/projects.en.json /projects/data/projects.es.json \
            /projects/data/projects-ac.ca.json /projects/data/projects-ac.en.json /projects/data/projects-ac.es.json \
            /projects/data/some-words.ca.json /projects/data/some-words.en.json /projects/data/some-words.es.json \
            /projects/data/menu.ca.json /projects/data/menu.en.json /projects/data/menu.es.json; do
            curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "https://masellas.info$path" > /dev/null
            echo "ok: $path"
          done
          # Server-rendered rows and the first project's page: only when the live list has projects
          # (an empty list is legitimate).
          # Pages are read whole before grep (no pipe that grep -q could cut short under pipefail).
          get() { curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "https://masellas.info$1"; }
          id=$(get /projects/data/projects.ca.json | { grep -o '"id": *"[a-z0-9-]*"' || true; } | head -n 1 | sed 's/.*"\([a-z0-9-]*\)"$/\1/')
          if [ -n "$id" ]; then
            list=$(get /projects/)
            grep -qF "href=\"/projects/$id/\"" <<<"$list" \
              || { echo "::error::/projects/ has no server-rendered link to /projects/$id/"; exit 1; }
            echo "ok: /projects/ lists projects for crawlers"
            page=$(get "/projects/$id/")
            grep -qF "<link rel=\"canonical\" href=\"https://masellas.info/projects/$id/\">" <<<"$page" \
              || { echo "::error::/projects/$id/ is not that project's page"; exit 1; }
            echo "ok: /projects/$id/"
          fi
          for path in /robots.txt /sitemap.xml /sitemap-projects.xml /llms.txt; do
            curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "https://masellas.info$path" > /dev/null
            echo "ok: $path"
          done
          code=$(curl -sS --retry 5 --retry-delay 2 --retry-all-errors -o /dev/null -w '%{http_code}' https://masellas.info/admin/)
          echo "admin: HTTP $code"
          test "$code" = 200
